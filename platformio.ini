[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Flash partition table (Enables dual ~1.9MB app slots for WireGuard OTA)
board_build.partitions = min_spiffs.csv

; Flashing flags for ESP32-S3 stability
upload_flags = 
    --no-stub

; Build options and logging level
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0

; Serial monitor exception decoding
monitor_filters =
    esp32_exception_decoder

; Project dependencies
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    ciniml/WireGuard-ESP32 @ ^0.1.5
