[env:esp32-s3-devkitc-1]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Прапорці завантаження для стабільної прошивки S3
upload_flags = 
    --no-stub

; Налаштування USB та рівня логів
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0

; Порти для твоєї Ubuntu
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Декодер ексепшнів — незамінна річ при відладці тунелів і брокерів
monitor_filters =
    esp32_exception_decoder

; Залежності проєкту (автоматичне завантаження)
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    ciniml/WireGuard-ESP32 @ ^0.1.5
    sui77/rc-switch @ ^2.6.4